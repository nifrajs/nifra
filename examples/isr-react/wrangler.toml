name = "nifra-isr-react"
main = "dist-server/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Assets: the content-hashed client bundle (buildClient → ./public/assets) is served by the
# platform at /assets/*. Non-asset paths fall through to the worker (SSR + ISR).
assets = { directory = "./public" }

# The ISR page cache. `wrangler dev` provides a LOCAL (miniflare) KV automatically - no Cloudflare
# account needed. For `wrangler deploy`, create a namespace and paste its id:
#   bunx wrangler kv namespace create ISR_CACHE
[[kv_namespaces]]
binding = "ISR_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# The on-demand revalidation secret. Never a [vars] entry: `wrangler deploy` would ship it as plain
# text. Set it with `bunx wrangler secret put REVALIDATE_SECRET`; until then the deployed worker
# answers 404 on /__nifra/revalidate. Locally, pass one with `--var` (see the README).

# The ISR page-signing secret, at least 32 characters: withISR signs every page it writes to KV and
# serves only pages that verify. Also a secret, generated at random:
# `openssl rand -hex 32 | bunx wrangler secret put ISR_STORE_SECRET`; until then the deployed worker
# answers 500. Locally, pass one with `--var` (see the README).

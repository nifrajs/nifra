name = "nifra-isr"
main = "dist-server/worker.js"
# 2025-04-01 or later: from that date `nodejs_compat` fills `process.env` from the Worker's variables,
# where backend/app.ts reads NIFRA_ALLOW_MEMORY_RATE_LIMIT; until that variable is "true" the deployed
# Worker refuses to start. Set it (a Worker variable, or [vars] below) only if a per-isolate rate limit
# will do: Cloudflare runs many isolates and each counts alone. `bun run dev` sets it for its one local
# process.
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Workers Assets: the content-hashed client bundle (buildClient → ./public/assets) is served at
# /assets/*. Non-asset paths fall through to the worker (SSR + ISR).
assets = { directory = "./public" }

# The ISR page cache. `wrangler dev` provides a LOCAL (miniflare) KV automatically - no Cloudflare
# account needed. For `wrangler deploy`, create a namespace and paste its id:
#   bunx wrangler kv namespace create ISR_CACHE
[[kv_namespaces]]
binding = "ISR_CACHE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# On-demand revalidation secret. Never a [vars] entry: `wrangler deploy` would ship it as plain text
# and it would collide with a secret of the same name. Set it with
# `bunx wrangler secret put REVALIDATE_SECRET`; until then the deployed Worker answers 404 on
# /__nifra/revalidate. `bun run dev` passes a local value with --var.

# The ISR page-signing secret, at least 32 characters: withISR signs every page it writes to KV and
# serves only pages that verify. A secret too, never a [vars] entry: set it with
# `openssl rand -hex 32 | bunx wrangler secret put ISR_STORE_SECRET`; until then the deployed
# Worker answers 500.
# `bun run dev` passes a local value with --var.

# Test runner configuration.
# Coverage is opt-in, requested per run with `--coverage` (the `test:coverage` script does this for the
# ratchet's graded set). A plain `bun test` - and the pass/fail `test` step - therefore stays a clean
# pass/fail signal, and must NOT run coverage: a per-file threshold miss prints `0 fail` with no
# `(fail)` line, so it is indistinguishable from the tolerated Bun shutdown-exit quirk and the
# `tolerant-test.ts` wrapper would mask it. When coverage IS requested, the 0.9 floor below is the gate
# (≥90% line/function coverage per file) - honoured off the CLI flag even without `coverage = true`
# (verified on 1.3.14); the router/validator/descriptor core is held to 100% by review (the per-file
# report makes any regression visible immediately).
[test]
coverageThreshold = 0.9
# Loads before any test file. Disables fetch connection pooling for loopback only, so a recycled
# ephemeral port cannot serve a request from a pooled connection to the server that previously held
# it. That was the source of a moving, full-suite-only flake - see the file for the measurements.
preload = ["./scripts/test-preload.ts"]
# Bun-only build/dev tooling was excluded here wholesale on the premise that it is "not unit-testable to
# 90%". Measuring it disproved that: `prerender.ts` was already at 100% functions / 98% lines, and
# `build.ts` was 1.7 points from qualifying. The exclusions were load-bearing for nothing, while
# `build.ts` in particular grew into the static-file allowlist, symlink confinement and route-rule
# generation - request-path security code sitting outside the gate that is supposed to protect it.
#
# So exclusions here have to be earned per file and stated with a number, not assumed for a category.
coveragePathIgnorePatterns = [
  # `vite.ts` sits at 97.6% LINE / 90.3% FUNCTION coverage (28/31 functions, measured 2026-08-14). It
  # clears the 90% floor, but by a single function: the three uncovered are `() => {}` no-op catches -
  # the error swallows on `reader.cancel()` (a client disconnecting mid-stream) and on `vite.close()`
  # teardown after a bind failure. Covering or shedding one flips the file across the floor run-to-run.
  # Reaching those bodies means contriving a rejection from Vite's own teardown, which would measure the
  # mock rather than the code. Excluded to keep the gate off a razor-thin margin of empty error bodies,
  # not because the file is untested - its 97.6% line coverage says it is exercised.
  "**/web/src/vite.ts",
  # Throwaway temp APPS that the build-tooling tests (`buildTarget`/`buildClient`) generate + bundle:
  # their stub route components are bundled, never rendered (the stub adapter emits chain length, not
  # the component), so they report 0% function coverage. They aren't product code - exclude the temp
  # fixture dirs from the per-file gate (same rationale as build.ts above).
  "**/web/test/.tmp-*/**",
  # Same class, in the cli tests: `mkdtemp`'d app fixtures whose directory name is random per run
  # (`.tmp-load-YT8mKB`). Beyond the per-file gate they also churned the committed coverage baseline -
  # every `--update` swapped one random path for another, so the diff never meant anything.
  "**/cli/test/.tmp-*/**",
  # The `@nifrajs/cli` package is dev/MCP tooling - command dispatch (`cli.ts`), stdio/JSON-RPC MCP
  # servers (`mcp.ts`, `mcp-render.ts`, `mcp-run.ts`, `mcp-ws.ts`), and `check`/`doctor`/`port`. Its
  # tests NOW run in the gated suite (so regressions are caught), but the spawn/stdio/process surface
  # isn't unit-testable to 90% - exclude `cli/src` from the per-file gate, same rationale as the
  # build/dev tooling above. Behavior is gated by the tests running, not by a line-coverage floor.
  "**/cli/src/**",
  # Temp route/app fixtures the cli tests mkdtemp into the system temp dir (`nifra-routes-*`,
  # `nifra-render-*`, `nifra-run-*`, `nifra-scaffold-*`, `tmp-nifra-ws-*`, …): their stub `.tsx`
  # routes are bundled/scanned, never rendered, so they report 0% function coverage (same class as
  # `web/test/.tmp-*` above). No repo path segment starts with `nifra-`, so these never match product
  # code - only the throwaway fixtures.
  "**/nifra-*/**",
  "**/tmp-nifra-*/**",
  "**/.tmp-nifra-*/**",
  # Demo apps under `examples/` that the cli render/run tests bundle as real fixtures: their route
  # components are bundled, not exercised, so they report low function coverage. They're sample code,
  # not unit-tested product code - exclude from the per-file gate.
  "**/examples/**",
  # `@nifrajs/mcp/react`'s `reactWidget` bundles a component with `Bun.build`, which reads
  # `react/index.js` from the consumer tree. Under a large `--coverage` process that read throws
  # `Unexpected reading file: .../react/index.js` and fails the widget test - reproducible on 1.3.14,
  # measured 2026-08-14. So its bundling test (`react.test.ts`) is kept in the pass/fail `test` run but
  # OUT of `test:coverage`; the rest of `mcp/src` (protocol, http, tool, tool-contract, server, standard,
  # widget, bridge) IS gated - `mcp.test.ts` + `tool-contract.test.ts` run in `test:coverage` and the cli
  # tests lift protocol/http to ~97/91%. `react.ts` itself never loads in the coverage run (nothing there
  # calls `reactWidget`), so exclude it explicitly: it documents why the file is absent and stops a future
  # coverage-run import of it from dragging in the crashing bundle. Its logic is asserted by `react.test.ts`.
  "**/mcp/src/react.ts",
  # `@nifrajs/ts-plugin`'s index.ts is the TypeScript language-service GLUE (`init`/`create`, the
  # language-service proxy, and `getDefinitionAndBoundSpan` wiring) - it only runs inside a real tsserver,
  # which bun:test has no host for (same class as cli/src's stdio surface). The LOGIC it wires is pure and
  # unit-tested: `resolve.ts` (route path → file, measured here) and the exported `findRoutePathLiteral`/
  # `findRoutesDir` (tested against a real `ts.SourceFile`). So the glue is excluded from the per-file gate
  # while its behavior is asserted; the plugin's editor activation is verified in an editor, not here.
  "**/ts-plugin/src/index.ts",
  # `@nifrajs/web-react/query` (useQuery/useMutation/useInfiniteQuery/QueryClientProvider/
  # HydrationBoundary) is a thin `useSyncExternalStore` binding over the agnostic query engine. Its ONLY
  # untested line is the fetch-on-mount `useEffect` callback, which React runs on commit - something
  # bun:test (no DOM) never does, same as the adapter's hydration (browser-verified; see
  # dual-react.test.ts). ALL query LOGIC lives in the injected-clock engine (`web/src/query.ts`,
  # unit-tested ~96%), and the binding's non-effect surface (SSR snapshots, mutate/mutateAsync,
  # useQueryClient, HydrationBoundary seeding) is covered by `query.test.ts` - so the file sits at ~98%
  # LINE coverage but can't reach the 90% FUNCTION floor without a browser. Exclude it from the per-file
  # gate (same rationale as cli/src, mcp/src above); the tests still run and assert behavior.
  "**/web-react/src/query.ts",
  # `@nifrajs/web-preact/router` (useNavigate + useBlocker) is a thin binding over the agnostic history
  # bridges. Its only untested lines are `useBlocker`'s registration `useEffect`, which Preact runs on
  # commit - something bun:test (no DOM) never does, same as query.ts above. The interception + restore-
  # then-prompt LOGIC lives in `web/src/client.ts` (mutation-proven in `client-browser.test.ts`), and the
  # binding's non-effect surface (useNavigate both paths, the SSR-idle blocker) is asserted by
  # `router.test.ts`. The Vue/Solid/Svelte routers reach 100% because they register synchronously in their
  # reactive scope; Preact/React register in an effect, so this file can't clear the floor without a
  # browser. Exclude it from the per-file gate (same rationale as web-react/query.ts); the tests still run.
  "**/web-preact/src/router.ts",
  # `core/src/binary.ts` is excluded for a DIFFERENT reason than everything above: not code this
  # harness cannot reach, but a measurement this reporter gets wrong. Bun 1.3.14 attributes the
  # file's hits to the last 14 LINES rather than to the lines that ran. Three measurements, all
  # reproducible:
  #   - `DA:32,0` for `export const NIFRA_BINARY_HEADER`, a module-level constant that
  #     `binary.test.ts` imports and asserts on twice. A module cannot load with that unexecuted.
  #   - `FNH:2` of `FNF:5`, with `contentDisposition` among the unhit - while the tests assert on
  #     `filename*=UTF-8''...` output that only `contentDisposition` produces.
  #   - Copying the file and stripping its comments took it from 128 lines to 48, and the reported
  #     hit block moved with the file end (114-127 -> 34-47). It tracks position, not execution.
  # So the 14.58% line / 40% function reading is fiction: the file is covered by 11 tests and 23
  # assertions spanning every export - hostile filenames, CRLF injection, CJK names, and the RFC
  # 5987 `filename*` encoding. Excluded so a fictional number stops dragging the global floor and
  # stops banking a meaningless baseline. Re-measure on a Bun upgrade and drop this if it is fixed.
  "**/core/src/binary.ts",
  # The suite's own preload (`scripts/test-preload.ts`) - harness, not product code. Its wrapper only
  # runs on a LOOPBACK fetch, so a suite that drives no socket (the `mcp`/`mcp-db` run) reports 0%
  # function coverage on it and fails the per-file floor, while the same file sits well above the floor
  # in the socket-heavy run. Coverage of the harness measures which suite is executing, not whether the
  # code under test is exercised, so it is excluded rather than chased.
  "**/scripts/test-preload.ts",
]
pathIgnorePatterns = ["**/template/**", "**/template-*/**"]

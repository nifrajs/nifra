[extend]
useDefault = true

# Exact, non-secret fixtures used to exercise signing and server-only leak prevention. These values
# are harmless wherever they appear; never path-allowlist test directories, so real credentials in
# fixtures and dev-tool code remain detectable.
[[allowlists]]
description = "Documented cryptographic, protocol, and redaction-test fixtures"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
  '''^integration-secret-at-least-32by$''',
  '''^whsec_test_padded_to_at_least_32b$''',
  '''^ghsecret_padded_to_at_least_32byt$''',
  '''^(?:s3cret-key_padded_to_at_least_32|s3cret_padded_to_at_least_32_byte)$''',
  '''^sk-live-1234567890$''',
  # RFC 6455 appendix A1 example WebSocket key - a documented constant, never a credential.
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
  # Deliberately-invalid placeholders: used to assert that failure messages never echo the value.
  '''^sk_live_(?:abcdefghijklmnop|supersecret_value)$''',
  '''^sk-proj-abcdefghijklmnop1234\.$''',
  '''^test-secret-32-bytes-long-abcdef$''',
]

# These exact findings are test fixtures. Each path exception is attached only to its rule and
# exact source file, and requires an exact fixture value as well as that path.

[[allowlists]]
description = "aws-access-token fixtures in packages/web/test/dev-feed.test.ts"
targetRules = ["aws-access-token"]
condition = "AND"
regexTarget = "secret"
paths = ["(?:^|/)packages/web/test/dev-feed\\.test\\.ts$"]
regexes = [
  "^AKIAABCDEFGHIJKLMNOP$",
]


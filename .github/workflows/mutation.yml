name: Mutation

# Report-only mutation testing of the lines a pull request changes (`scripts/mutate.ts`). The score
# and the surviving mutants go to the job summary and the `mutation-report` artifact. Every step may
# fail without failing the job, and the job is not a required check.

on:
  pull_request:
    paths:
      - "packages/*/src/**"
      - "scripts/mutate.ts"
      - "mutation-equivalents.json"
      - ".github/workflows/mutation.yml"

permissions: {}

concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-lines:
    name: mutation (changed lines)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The changed lines are diffed against the merge base with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install
        continue-on-error: true
        run: bun install --frozen-lockfile

      # Some selected tests read built output; without it they fail on the baseline and kill nothing.
      - name: Build
        continue-on-error: true
        run: bun run build

      # Without a server the live Postgres suites skip, and every mutant only they kill survives. The
      # runner image ships PostgreSQL with its service off; the password guards a localhost throwaway.
      - name: Start PostgreSQL
        continue-on-error: true
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'nifra-ci'"

      # --bail stops each test run at its first failure, so the kill matrix names one killer per mutant.
      - name: Mutate the changed lines
        continue-on-error: true
        run: bun scripts/mutate.ts --changed origin/main --bail --max-minutes 25
        env:
          NIFRA_TEST_POSTGRES_URL: postgres://postgres:nifra-ci@127.0.0.1:5432/postgres

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        continue-on-error: true
        with:
          name: mutation-report
          path: .mutation/
          include-hidden-files: true
          if-no-files-found: ignore

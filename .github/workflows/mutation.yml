name: Mutation

# Report-only mutation testing of the lines a pull request changes (`scripts/mutate.ts`). The score
# and the surviving mutants go to the job summary and the `mutation-report` artifact. Every step may
# fail without failing the job, and the job is not a required check.

on:
  pull_request:
    paths:
      - "packages/*/src/**"
      - "scripts/mutate.ts"
      - "mutation-equivalents.json"
      - ".github/workflows/mutation.yml"

permissions: {}

concurrency:
  group: mutation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changed-lines:
    name: mutation (changed lines)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # The changed lines are diffed against the merge base with origin/main.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Install
        continue-on-error: true
        run: bun install --frozen-lockfile

      # Some selected tests read built output; without it they fail on the baseline and kill nothing.
      - name: Build
        continue-on-error: true
        run: bun run build

      # --bail stops each test run at its first failure, so the kill matrix names one killer per mutant.
      - name: Mutate the changed lines
        continue-on-error: true
        run: bun scripts/mutate.ts --changed origin/main --bail --max-minutes 25

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true
        with:
          name: mutation-report
          path: .mutation/
          if-no-files-found: ignore

name: Workflow lint

# zizmor audits the workflows for template injection, credential persistence, dangerous triggers,
# excessive permissions and unpinned or impostor actions. A finding fails the job and annotates the
# line; a deliberate exception is an inline `# zizmor: ignore[<audit>]` beside a comment saying why.
on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: zizmor-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Annotations instead of a code scanning upload, so fork PRs need no security-events: write. The
      # online audits (impostor commits, known-vulnerable actions) read public data with this token.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github/workflows
          advanced-security: false
          annotations: true

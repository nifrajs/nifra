name: Benchmark accuracy

# A longer, opt-in sampling budget. Reuse the nightly harness so its workload,
# runtime pins, core isolation, and report format stay identical.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accuracy:
    # A reusable workflow called with ./ already comes from the caller's commit, not the workspace;
    # actionlint 1.7.12 rejects $/ and would stop type-checking these inputs.
    uses: ./.github/workflows/benchmarks.yml # zizmor: ignore[self-repository]
    with:
      min_runs: 7
      max_runs: 15
      max_ci_width: 5
      skip_ssr: true

name: Benchmarks

# Throughput on GitHub-hosted runners, as a report. Absolute req/s on a shared VM moves severalfold
# between runs, so the ratios are what compare: each row against its workload's ceiling (the runtime's
# raw server; for SSR the table's baseline row, the divisor of bench:ssr's ratios), and nifra against
# each rival, with the median req/s printed beside them, sampled seconds apart in interleaved rounds, with the
# server and oha pinned to separate physical cores. Each job keeps sampling until every
# row's 95% interval is narrow or its run budget is spent, and lists what stayed noisy.
#
# Nothing here gates a merge. The nightly reports exist to measure this runner's noise floor first;
# a regression gate gets its tolerance from them, never from a guess.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      min_runs:
        description: Whole-matrix runs before the noise check (4 rounds each; 2 is the minimum for a 95% interval)
        type: number
        default: 3
      max_runs:
        description: Run budget per job when rows stay noisy
        type: number
        default: 5
      max_ci_width:
        description: Target width of the 95% interval in percentage points
        type: number
        default: 10
  workflow_call:
    inputs:
      min_runs:
        type: number
        default: 3
      max_runs:
        type: number
        default: 5
      max_ci_width:
        type: number
        default: 10
      # An SSR run takes an estimated 20 minutes, so the accuracy workflow's 15-run budget could hit
      # the job's six-hour limit.
      skip_ssr:
        type: boolean
        default: false
  # Only for a PR a maintainer labels `bench`; every push to it re-runs until the label comes off.
  # A PR run skips SSR, which takes about 80 minutes per job: SSR runs nightly and on dispatch.
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
      (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    name: ${{ matrix.suite }} on ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    # The manual accuracy workflow can collect up to 15 whole-matrix runs.
    timeout-minutes: 360
    env:
      MIN_RUNS: ${{ inputs.min_runs || '3' }}
      MAX_RUNS: ${{ inputs.max_runs || '5' }}
      MAX_CI_WIDTH: ${{ inputs.max_ci_width || '10' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [http, realworld, ssr]
        runtime: [bun, node, deno]
        exclude:
          # The SSR rival apps and harness run on Bun and Node only.
          - suite: ssr
            runtime: deno
          - suite: ${{ (inputs.skip_ssr || github.event_name == 'pull_request') && 'ssr' || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7

      # The harness passes oha 1.16 flags, so the version is pinned, and the binary by its digest.
      - name: Install oha 1.16.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/oha" \
            https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          echo "620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716  $HOME/.local/bin/oha" | sha256sum -c -
          chmod +x "$HOME/.local/bin/oha"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Runner identity
        env:
          SUITE: ${{ matrix.suite }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p bench-ci/metadata
          {
            printf 'commit=%s\nrun_id=%s\nattempt=%s\nsuite=%s\nruntime=%s\nmin_runs=%s\nmax_runs=%s\nmax_ci_width=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SUITE" "$RUNTIME" "$MIN_RUNS" "$MAX_RUNS" "$MAX_CI_WIDTH"
            date -u +%FT%TZ
            bun --version
            bun --revision
            node --version
            deno --version
            uname -srm
            lscpu
            oha --version
          } | tee "bench-ci/metadata/$SUITE-$RUNTIME.txt"

      - name: Install
        run: bun install --frozen-lockfile

      # The nifra servers load core and middleware from dist, like a deployed app. Middleware's build
      # needs schema's declarations, so the full ordered build is the reliable one.
      - name: Build
        run: bun run build

      - name: Harness unit tests
        run: bun test bench/ci bench/rounds.test.ts bench/ssr/matrix.test.ts bench/ssr/section.test.ts

      - name: Measure
        env:
          SUITE: ${{ matrix.suite }}
          RUNTIME: ${{ matrix.runtime }}
        run: >-
          bun run bench/ci/run.ts --suite "$SUITE" --runtime "$RUNTIME"
          --min-runs "$MIN_RUNS" --max-runs "$MAX_RUNS" --max-ci-width "$MAX_CI_WIDTH" --pin
          --out "bench-ci/$SUITE-$RUNTIME.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bench-${{ matrix.suite }}-${{ matrix.runtime }}
          path: |
            bench-ci/${{ matrix.suite }}-${{ matrix.runtime }}.json
            bench-ci/metadata/${{ matrix.suite }}-${{ matrix.runtime }}.txt
          if-no-files-found: error
          retention-days: 90

  summary:
    needs: measure
    # Runs when a measure job failed, but not for a cancelled run, which may have no report at all.
    if: ${{ !cancelled() && needs.measure.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: bench-*
          path: bench-ci
          merge-multiple: true

      - name: Combined report
        env:
          SUITES: ${{ (inputs.skip_ssr || github.event_name == 'pull_request') && 'http,realworld' || 'http,realworld,ssr' }}
        run: bun run bench/ci/summary.ts bench-ci --suites "$SUITES" >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue gates on the required checks run against main plus the queued pull requests.
  merge_group:
  # A manual run, for any branch, to get the Windows job on a branch before cutting a release.
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    name: check (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [static, coverage, tests, postgres, cli-isolation, docs, site, packages, consumers, cold-start]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Changeset coverage needs the last commit that consumed changesets.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Runtime identity
        run: |
          bun --version
          bun --revision
          uname -srm

      - name: Install
        run: bun install --frozen-lockfile

      # Cross-package imports resolve built declarations. Each group owns its build so
      # concurrent gates cannot mutate one another's fixtures or generated output.
      - name: Build
        run: bun run build

      - name: Lint
        if: matrix.group == 'static'
        run: bun run lint

      - name: Typecheck (including type-level tests)
        if: matrix.group == 'static'
        run: bun run typecheck

      - name: Test with coverage ratchet
        if: matrix.group == 'coverage'
        run: bun run test:coverage && bun run check:coverage

      # The static-file invariants execute the generated Deno entry.
      - name: Set up Deno
        if: matrix.group == 'tests'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7

      - name: Test suites outside the coverage run
        if: matrix.group == 'tests'
        run: bun run test:rest

      # The live Postgres suites skip without a server. The runner image ships one with its service
      # off; the password only guards a throwaway server bound to localhost.
      - name: Start PostgreSQL
        if: matrix.group == 'postgres'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'nifra-ci'"
          # Without dblink the suite's dblink checks return early and pass.
          test "$(psql "$NIFRA_TEST_POSTGRES_URL" -tAc "SELECT count(*) FROM pg_available_extensions WHERE name = 'dblink'")" = 1
        env:
          NIFRA_TEST_POSTGRES_URL: postgres://postgres:nifra-ci@127.0.0.1:5432/postgres

      - name: Live Postgres suites (mcp-db and nifra db)
        if: matrix.group == 'postgres'
        run: bun run test:postgres
        env:
          NIFRA_TEST_POSTGRES_URL: postgres://postgres:nifra-ci@127.0.0.1:5432/postgres

      - name: CLI fixture isolation (randomized test order)
        if: matrix.group == 'cli-isolation'
        run: bun run check:cli-isolation
        env:
          NIFRA_TEST_SEED: ${{ github.run_number }}

      - name: Doc gates (samples, generated corpora, sitemap)
        if: matrix.group == 'docs'
        run: bun run check:docs && bun run check:corpus && bun run check:sitemap

      - name: Site production build
        if: matrix.group == 'site'
        run: bun run check:site

      - name: Publish-readiness (packed files, publint, arethetypeswrong)
        if: matrix.group == 'packages'
        run: bun run check:publish

      # Fork PRs enforce the structural boundary; main pushes also require private markers.
      - name: Public boundary
        if: matrix.group == 'static'
        run: bun run check:public-boundary
        env:
          PRIVATE_MARKERS: ${{ secrets.PRIVATE_MARKERS }}
          RELEASE_MODE: ${{ github.event_name == 'push' && '1' || '' }}

      - name: Public product manifest
        if: matrix.group == 'static'
        run: bun run check:public-manifest

      - name: Agent surface manifests
        if: matrix.group == 'static'
        run: bun run check:plugin

      - name: Publish-consumer matrix (isolated declarations, no hoisting)
        if: matrix.group == 'consumers'
        run: bun run check:consumers

      - name: Cold-start gate (templates install and build)
        if: matrix.group == 'cold-start'
        run: bun run check:cold-start

      # Bundle sizes are deterministic. Timing measurements stay in benchmarks.yml.
      - name: Bundle-size gate
        if: matrix.group == 'packages'
        run: bun run check:size

      - name: Changeset coverage
        if: matrix.group == 'static'
        run: bun run check:changesets

      - name: Verification plan / CI parity
        if: matrix.group == 'static'
        run: bun run check:verification-parity

      - name: Server component contracts
        if: matrix.group == 'static'
        run: bun run check:server-components:contracts

  # Preserve the required check name; a failed or skipped matrix must never appear green.
  check:
    name: check
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every check group passed
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.checks.result }}

  server-components:
    # The browser x runtime matrix runs once per release, in release verification. This job is the
    # manual pre-release run for a branch; PRs keep the contracts step and the component unit tests.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install required browser engines
        run: node packages/web/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nifra-playwright
      - name: All five adapters and every runtime, browser and lifecycle row
        run: bun run check:server-components
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nifra-playwright
      - name: Isolated packaged feature consumers
        run: bun run check:server-components:consumers
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nifra-playwright

  windows:
    # Windows is the slowest platform job. Run it for main pushes, release PRs, and manual runs so a
    # release is fully validated before merge, while ordinary feature PRs keep the fast loop.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # Exercise the same published build, type surface, and test suite on Windows. This catches
      # path separators, shell assumptions, and platform-specific stream behavior that Ubuntu cannot.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Bun 1.3.x on Windows can panic with an internal integer overflow after the entire monorepo
        # suite shares one process (~0.8 GB RSS in the failed run). This runs the exact same test dirs
        # through the strict tolerant wrapper, in bounded child processes; no tests are omitted and a
        # failed/crashed/no-summary child still fails the job.
        run: bun run scripts/test-windows.ts

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build @nifrajs/core, @nifrajs/web and @nifrajs/middleware (Deno loads built dist)
        # Their dist must exist for Deno's resolver; the live and partial prerendering tests import them.
        # Middleware's build reads @nifrajs/schema's types, and schema's read @nifrajs/uploads'.
        run: >-
          bun run --filter '@nifrajs/core' build &&
          bun run --filter '@nifrajs/uploads' build &&
          bun run --filter '@nifrajs/schema' --filter '@nifrajs/web' --filter '@nifrajs/middleware' build

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7

      - name: Typecheck + test @nifrajs/deno on Deno
        run: bun run test:deno

      # The suite above imports `packages/deno/src/index.ts` by workspace path, where Deno is
      # allowed to strip types - so it cannot see the shape a published consumer gets. 2.9.0 and
      # earlier shipped only `src/*.ts` and were unimportable from npm for exactly that reason.
      # This packs the tarball, installs it, and imports it as a Deno user does.
      - name: Published tarball installs + imports under Deno
        run: bun run check:deno-tarball

  # The Node adapter exercised on Node, not on Bun. The check job's Bun suite covers packages/node/test, which
  # proves the adapter's logic but runs it on the wrong runtime - and an HTTP adapter is precisely
  # where Bun and Node diverge (stream semantics, `node:` builtin behaviour, socket teardown). Deno
  # already had this job; Node and Workers did not, so two published adapters had zero coverage on
  # the runtimes they exist for. This closes the Node half.
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      # v4.4.0, a released commit rather than a branch tip. v5+ auto-enables package-manager caching
      # off `packageManager`, which looks for a lockfile this Bun repo does not have.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0

      - name: Install
        run: bun install --frozen-lockfile

      # Node resolves the package `exports` `default` condition → dist, which is what an installed
      # Node user actually loads. Same reason the Deno job builds first.
      - name: Build (Node loads built dist)
        run: bun run build

      # `bun install` writes no node_modules/@nifrajs/* entries - Bun resolves the workspace through
      # its own map - so without this step Node cannot resolve the packages at all.
      - name: Test @nifrajs/node on Node
        run: bun run test:node

  # The Workers adapter needs a real workerd execution, not only Bun's WebSocketPair mock. Wrangler's
  # local dev server runs the same workerd runtime used by the platform and persists the Durable Object
  # SQLite state in a temporary directory owned by the job.
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the Worker contract dependencies
        # Schema's build resolves @nifrajs/core/* through its published-style dist declarations. Keep
        # these explicit and sequential: one multi-filter invocation may start the builds in parallel,
        # which makes a clean CI checkout fail before core has emitted its subpath .d.ts files.
        run: bun run --filter '@nifrajs/core' build && bun run --filter '@nifrajs/schema' build

      - name: Run the real workerd contract laboratory
        run: bun run check:workerd

  # One app on Bun (app.fetch and Bun.serve), Node, Deno and a local workerd, sent the same generated
  # requests and WebSocket sessions and held to one set of invariants and to each other
  # (scripts/check-runtime-differential.ts).
  # The fixed seed keeps a pull request's run repeatable; the nightly runtime-differential workflow
  # explores fresh seeds with a far larger budget.
  runtime-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7

      - name: Install
        run: bun install --frozen-lockfile

      # Node and Deno load the built dist, and wrangler bundles the Worker from it.
      - name: Build
        run: bun run build

      - name: Generated requests on every runtime
        env:
          NIFRA_DIFFERENTIAL_SEED: "20261022"
          NIFRA_DIFFERENTIAL_RUNS: "400"
          NIFRA_DIFFERENTIAL_WS_RUNS: "60"
        run: bun run check:runtime-differential

  # Opt-in evidence for the two production bundlers. The fixture deliberately contains routes, public
  # files, shared CSS Modules, and a keyframe export so a dropped route or a pipeline-specific class map
  # turns this job red. Hashed filenames are intentionally ignored by the checker.
  pipeline-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # The fixture's client bundle imports `@nifrajs/web/client`, which resolves to the published
      # `dist/client.js` under a browser-target build - so the packages have to be built first, the
      # same as every other job that exercises the shipped artifact.
      - name: Build
        run: bun run build

      - name: Compare Bun and Vite production pipelines on the fixture app
        run: bun run check:pipeline-parity

      # Every way server code or a credential can reach a browser, against both bundlers, both dev
      # servers, the server build, each framework's route syntax and each deploy target's output.
      - name: Leak matrix
        run: bun run check:leak-matrix

  # Scan Bun's lockfile as part of the release-gated CI workflow. This job is deliberately a
  # reusable OSV workflow so a known advisory cannot pass CI and still reach the release workflow.
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc
    with:
      scan-args: |-
        --lockfile=./bun.lock
    permissions:
      # The reusable osv-scan job requests actions:read as well. A caller permissions block sets every
      # unlisted scope to `none`, and a reusable job requesting more than the caller granted fails the
      # whole workflow at validation time (startup_failure), so this must mirror the callee exactly.
      actions: read
      contents: read
      security-events: write

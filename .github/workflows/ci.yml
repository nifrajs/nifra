name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: the changeset-coverage gate anchors on the last commit that consumed
          # changesets, which is many commits back. The default shallow clone cannot reach it, and
          # the gate reports that as inconclusive rather than guessing.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      # The version ALONE does not identify a build: two Bun binaries reporting 1.3.14 can behave
      # differently, and that difference is invisible from a developer machine where everything passes.
      # Printing the revision and arch turns "works locally, fails on CI" into a comparison rather than a
      # guess - the Vite build was debugged as a nifra bug for several rounds because this line did not
      # exist and the runtime was assumed identical.
      - name: Runtime identity (version alone does not identify a build)
        run: |
          bun --version
          bun --revision
          uname -srm

      - name: Install
        run: bun install --frozen-lockfile

      # Cross-package imports (e.g. cli → @nifrajs/web) resolve via each package's built
      # .d.ts, not via tsconfig paths - so typecheck needs dist. check:publish re-packs later.
      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Typecheck (also runs the *.test-d.ts type-level tests)
        run: bun run typecheck

      - name: Test (scoped to the library test dirs; pass/fail only - coverage is the ratchet step below)
        run: bun run test

      # Fixture roots are unique, but shared state can still hide an order dependency. Bun prints the
      # seed on failure; deriving it from the run number makes each CI run explore a different order
      # while keeping a failing run exactly reproducible (`--seed=<run number>`).
      - name: CLI fixture isolation (randomized test order)
        run: bun run check:cli-isolation
        env:
          NIFRA_TEST_SEED: ${{ github.run_number }}

      # The floor in bunfig says "≥90%". This says "not less than last time". A file at 99% can shed
      # coverage indefinitely without tripping a floor, and the drop only surfaces years later as
      # somebody else's failing build - so the erosion is caught where it happens.
      - name: Coverage ratchet (no file may lose coverage against the committed baseline)
        run: bun run test:coverage && bun run check:coverage

      # Enforce the doc gates in CI (not just `bun run check` locally): documented snippets must
      # typecheck against the live API, and api-reference.md + the per-package LLM.md cards must be
      # regenerated - so docs/example drift can't merge. Needs the build above (snippets resolve
      # @nifrajs/* subpaths via the built dist types).
      # `check:corpus` covers the four agent-facing corpora (llms.txt, llms-full.txt, examples.json,
      # types.json), API reference, package cards, and the Node outcome contract. They were the only
      # generated artifacts with no gate, so they were as fresh as whoever last remembered to run
      # `gen:llms` - and `types.json` is what the `nifra_types` MCP tool answers from, so stale is not
      # cosmetic: it hands an agent a signature the code no longer has.
      - name: Doc gates (samples typecheck, api-reference + LLM cards + llms corpora fresh)
        run: bun run check:docs && bun run check:corpus

      - name: Build + publish-readiness (publint + arethetypeswrong)
        run: bun run check:publish

      # The names to scan for are themselves private, so they arrive as a repository secret rather
      # than living in the tree. Unset, the step still enforces the structural half (seams exported,
      # no runtime builtins in an edge seam).
      - name: Public boundary (seam exports, edge portability, private markers)
        run: bun run check:public-boundary
        env:
          PRIVATE_MARKERS: ${{ secrets.PRIVATE_MARKERS }}

      - name: Public product manifest (README package map is generated)
        run: bun run check:public-manifest

      # attw and the workspace can resolve undeclared internal packages through hoisted siblings. Pack
      # selected public packages, install each one with npm's nested strategy, and typecheck its public
      # entry from a three-line external consumer so only declared dependencies are visible.
      - name: Publish-consumer matrix (isolated declarations, no hoisting)
        run: bun run check:consumers

      # Cold-start gate: the `bun create nifra` → `bun install` → `bun run build` path a fresh external
      # user takes. alpha.4's templates pinned `@nifrajs/*@^0.1.0` (excludes the published prerelease) →
      # every scaffolded app failed to install; the package-level gates never look at the templates.
      # Static pin-satisfiability + a functional scaffold/install/build against the packed current source.
      - name: Cold-start gate (templates install + build for a fresh user)
        run: bun run check:cold-start

      # Bundle-size gate: per-feature gzip budgets (FEATURE_GZIP_BUDGET_KB in bench/size/run.ts).
      # What ships in a user's server artifact is a headline claim, and the marginal cost of a
      # feature is only visible at the moment it lands - a byte-count regression is invisible in
      # review and unattributable a release later. Deterministic (same minifier, fixed app shapes,
      # pinned Bun), so it belongs in CI where wall-clock throughput does not: `bench:http` measures
      # requests/sec via `oha`, and shared runners have noisy neighbours that swing that severalfold
      # run to run. A gate that cries wolf gets disabled, so throughput stays a local/manual
      # comparison (`bench:http:compare`) and CI gates only the reproducible number.
      - name: Bundle-size gate (per-feature gzip budgets)
        run: bun run check:size

      # Release-notes gate: a package whose src moved since the last release must be named by a
      # pending changeset. Versioning here is `fixed`, so a missing entry does not change the version
      # that ships - it removes the CHANGELOG line, and the omission is invisible until a consumer
      # upgrades into an undocumented change. That has already happened once: a client type change
      # rode in under a changeset naming three other packages, so the client's notes for that release
      # described a different commit entirely.
      - name: Changeset coverage (a changed package must say it changed)
        run: bun run check:changesets

      # Keep the declarative release plan and this hand-authored workflow from drifting in either
      # direction. Shared-runner performance is the one explicit plan exception: it remains a local
      # release gate because request throughput is too noisy to require on CI.
      - name: Verification plan / CI parity
        run: bun run check:verification-parity

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Exercise the same published build, type surface, and test suite on Windows. This catches
      # path separators, shell assumptions, and platform-specific stream behavior that Ubuntu cannot.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  deno:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build @nifrajs/core (Deno loads built dist)
        # Core's dist must exist for Deno's resolver.
        run: bun run --filter '@nifrajs/core' build

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x

      - name: Typecheck + test @nifrajs/deno on Deno
        run: bun run test:deno

      # The suite above imports `packages/deno/src/index.ts` by workspace path, where Deno is
      # allowed to strip types - so it cannot see the shape a published consumer gets. 2.9.0 and
      # earlier shipped only `src/*.ts` and were unimportable from npm for exactly that reason.
      # This packs the tarball, installs it, and imports it as a Deno user does.
      - name: Published tarball installs + imports under Deno
        run: bun run check:deno-tarball

  # The Node adapter exercised on Node, not on Bun. `bun run test` covers packages/node/test, which
  # proves the adapter's logic but runs it on the wrong runtime - and an HTTP adapter is precisely
  # where Bun and Node diverge (stream semantics, `node:` builtin behaviour, socket teardown). Deno
  # already had this job; Node and Workers did not, so two published adapters had zero coverage on
  # the runtimes they exist for. This closes the Node half.
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      # v4.4.0, a released commit rather than a branch tip. v5+ auto-enables package-manager caching
      # off `packageManager`, which looks for a lockfile this Bun repo does not have.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x

      - name: Install
        run: bun install --frozen-lockfile

      # Node resolves the package `exports` `default` condition → dist, which is what an installed
      # Node user actually loads. Same reason the Deno job builds first.
      - name: Build (Node loads built dist)
        run: bun run build

      # `bun install` writes no node_modules/@nifrajs/* entries - Bun resolves the workspace through
      # its own map - so without this step Node cannot resolve the packages at all.
      - name: Test @nifrajs/node on Node
        run: bun run test:node

  # The Workers adapter needs a real workerd execution, not only Bun's WebSocketPair mock. Wrangler's
  # local dev server runs the same workerd runtime used by the platform and persists the Durable Object
  # SQLite state in a temporary directory owned by the job.
  workers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build the Worker contract dependencies
        run: bun run --filter '@nifrajs/core' --filter '@nifrajs/schema' build

      - name: Run the real workerd contract laboratory
        run: bun run check:workerd

  # Opt-in evidence for the two production bundlers. The fixture deliberately contains routes, public
  # files, shared CSS Modules, and a keyframe export so a dropped route or a pipeline-specific class map
  # turns this job red. Hashed filenames are intentionally ignored by the checker.
  pipeline-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # The fixture's client bundle imports `@nifrajs/web/client`, which resolves to the published
      # `dist/client.js` under a browser-target build - so the packages have to be built first, the
      # same as every other job that exercises the shipped artifact.
      - name: Build
        run: bun run build

      - name: Compare Bun and Vite production pipelines on the fixture app
        run: bun run check:pipeline-parity

  # Scan Bun's lockfile as part of the release-gated CI workflow. This job is deliberately a
  # reusable OSV workflow so a known advisory cannot pass CI and still reach the release workflow.
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1
    with:
      scan-args: |-
        --lockfile=./bun.lock
    permissions:
      # The reusable osv-scan job requests actions:read as well. A caller permissions block sets every
      # unlisted scope to `none`, and a reusable job requesting more than the caller granted fails the
      # whole workflow at validation time (startup_failure), so this must mirror the callee exactly.
      actions: read
      contents: read
      security-events: write

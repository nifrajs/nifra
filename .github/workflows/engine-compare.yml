name: Engine compare

# Rotated, serial wrk comparison of the Rust engine (@nifrajs/node-engine) against uWebSockets.js
# (@nifrajs/node-uws), node:http (@nifrajs/node) and Moro: the Moro framework and `@morojs/engine`
# written straight on its API. Moro is installed here only, from the pinned versions below; no nifra
# package depends on it. Manual: the numbers that go in a report come from this run, not a laptop.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rotations per workload (each target runs once per rotation)
        type: number
        default: 5
      duration:
        description: Seconds per wrk run
        type: number
        default: 6

permissions:
  contents: read

jobs:
  compare:
    name: engine compare
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      ROUNDS: ${{ inputs.rounds }}
      DURATION: ${{ inputs.duration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0

      - name: Install wrk
        run: sudo apt-get update && sudo apt-get install -y wrk

      - name: Runner identity
        run: |
          mkdir -p bench-out
          {
            printf 'commit=%s\nrun_id=%s\nattempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            date -u +%FT%TZ
            node --version
            rustc --version
            wrk --version 2>&1 | head -1
            uname -srm
            lscpu
          } | tee bench-out/metadata.txt

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Build the Rust addon
        run: cargo build --release --locked -p nifra-napi --manifest-path native/nifra-engine/Cargo.toml

      - name: Install the competitors
        run: >-
          npm install --prefix "$RUNNER_TEMP/moro" --no-audit --no-fund
          @morojs/moro@1.9.1 @morojs/engine@1.2.1 zod@4.6.7

      - name: Compare
        env:
          ROOT: ${{ github.workspace }}
          OUT: bench-out
        run: |
          cp native/nifra-engine/target/release/libnifra_napi.so "$RUNNER_TEMP/nifra_napi.node"
          export NIFRA_RUST_ENGINE_PATH="$RUNNER_TEMP/nifra_napi.node" MORO_DIR="$RUNNER_TEMP/moro"
          node packages/node-engine/bench/compare.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engine-compare
          path: bench-out
          if-no-files-found: error
          retention-days: 90

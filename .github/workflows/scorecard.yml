name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain practices (pinned dependencies, token
# permissions, branch protection, SAST, dangerous workflow patterns) and files each failing check as
# a code scanning alert. Results stay in code scanning: publish_results would also send them to the
# public Scorecard API for the badge, which needs id-token: write.
on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Uploads the SARIF results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without an admin token in repo_token, Branch-Protection scores only what GITHUB_TOKEN can read.
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard

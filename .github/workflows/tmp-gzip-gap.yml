name: Temporary gzip comparison

# TEMPORARY. Measures a gzipped JSON route on one ubuntu runner for checkouts of this repo
# (before the PR, the PR head, and the PR head with candidate patches applied cumulatively) and a bare Bun.serve, interleaved. It runs when
# this file or its harness changes on the PR branch, and is removed from the PR before it merges.
on:
  push:
    branches:
      - perf/bun-gzip-inline-json-resident
    paths:
      - ".github/workflows/tmp-gzip-gap.yml"
      - "bench/tmp-gzip-gap/**"

permissions:
  contents: read

concurrency:
  group: tmp-gzip-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Gzip comparison
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      MAIN_SHA: f96bcc3e439a7e8dcd5a3a196b5d271ec329c87d
      PR_HEAD_SHA: 3393d7d9a362cd536cd706da187050bdafe9bc8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Install oha 1.16.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/oha" \
            https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          echo "620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716  $HOME/.local/bin/oha" | sha256sum -c -
          chmod +x "$HOME/.local/bin/oha"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check out the arms
        run: |
          mkdir -p ../arms
          for spec in "pr-head:$PR_HEAD_SHA:" "seamjson:$PR_HEAD_SHA:seam-json" "seamvalue:$PR_HEAD_SHA:seam-value"; do
            name="${spec%%:*}"
            rest="${spec#*:}"
            sha="${rest%%:*}"
            patch="${rest#*:}"
            git worktree add --detach "../arms/$name" "$sha"
            (
              cd "../arms/$name"
              if [ -n "$patch" ]; then
                git apply "$GITHUB_WORKSPACE/bench/tmp-gzip-gap/patches/$patch.patch"
              fi
              git log --oneline -1
              git diff --stat
              bun install --ignore-scripts --frozen-lockfile
            )
          done
      - name: Compare
        run: |
          {
            date -u +%FT%TZ
            bun --version
            uname -srm
            lscpu
            nproc
          } | tee gzip-gap-metadata.txt
          bun run bench/tmp-gzip-gap/harness.ts \
            --arm floor \
            --arm pr-head=../arms/pr-head \
            --arm value-style=../arms/pr-head@value \
            --arm seam-json=../arms/seamjson \
            --arm seam-value=../arms/seamvalue@value \
            --arm pr-head-again=../arms/pr-head \
            --rounds 6 --seconds 8 --warm 2 --conns 256 \
            --out gzip-gap.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gzip-gap
          path: |
            gzip-gap.json
            gzip-gap-metadata.txt
          if-no-files-found: error
          retention-days: 14

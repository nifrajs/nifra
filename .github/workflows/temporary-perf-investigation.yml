name: Temporary performance investigation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/temporary-perf-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, bun-fetch, node, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      - name: Install oha
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/oha" https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          echo "620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716  $HOME/.local/bin/oha" | sha256sum -c -
          chmod +x "$HOME/.local/bin/oha"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Compare historical and current snapshots
        env:
          BENCH_RUNTIME: ${{ matrix.runtime }}
        run: bun run bench/temporary-perf/compare.ts "$BENCH_RUNTIME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: temporary-perf-${{ matrix.runtime }}
          path: bench-ci/temporary-${{ matrix.runtime }}.json
          if-no-files-found: warn
          retention-days: 30

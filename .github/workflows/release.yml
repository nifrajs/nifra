name: Release

# Release preparation happens on a dedicated release/<name> branch. The release PR contains the
# changeset version commit and is the only PR that may introduce a release. This workflow never
# creates a second Version Packages PR and never writes to main from a pull_request run.
#
# After a release PR merges, the workflow_run path only publishes the exact CI-validated merge SHA.
# It is guarded by the GitHub API association between that SHA and a merged release PR, so an
# ordinary main merge is a no-op. A publish that failed after the merge (a registry or Pages outage, a
# package with no trusted publisher yet) is retried with workflow_dispatch on main naming that merge
# SHA, under the same proofs.
#
# npm publishes through trusted publishing: every public package trusts this workflow file run in the
# npm-publish environment, so there is no npm token to store or leak. Only a proven release enters
# it, and only the publish job holds the identity npm trusts.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Merge commit of the release PR whose publish to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name != 'pull_request' && 'publish' || github.event.pull_request.number }}
  queue: max
  cancel-in-progress: false

jobs:
  verify-release-pr:
    name: release-verification
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the proposed release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # The release plan runs the Deno and Node gates; the same pins as the ci.yml jobs that run them.
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release branch and generated versions
        run: bun run release:check

      # `--shared-runner` leaves out the timing gates, which the plan keeps off CI: a shared runner's
      # timing swings too far to gate on, so `bun run check:release` runs them locally before a merge.
      - name: Run release verification
        run: bun run verify:release --shared-runner
        env:
          RELEASE_MODE: "1"
          PRIVATE_MARKERS: ${{ secrets.PRIVATE_MARKERS }}

  prove-release:
    name: prove-release
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      release_base_sha: ${{ steps.release.outputs.release_base_sha }}
      merge_sha: ${{ steps.release.outputs.merge_sha }}
    steps:
      - name: Prove this is a merged release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha || inputs.merge_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$MERGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "merge_sha must be a full 40-character commit SHA." >&2
              exit 1
            fi
            # What the workflow_run path gets from its trigger: a commit on main whose push CI passed.
            on_main="$(gh api "repos/${REPOSITORY}/compare/${MERGE_SHA}...main" --jq .status)"
            if [[ "$on_main" != "ahead" && "$on_main" != "identical" ]]; then
              echo "${MERGE_SHA} is not on main; refusing to publish." >&2
              exit 1
            fi
            ci_passed="$(gh api \
              "repos/${REPOSITORY}/actions/runs?head_sha=${MERGE_SHA}&event=push&branch=main" \
              --jq 'any(.workflow_runs[]; (.path | split("@")[0]) == ".github/workflows/ci.yml" and .conclusion == "success")')"
            if [[ "$ci_passed" != "true" ]]; then
              echo "CI did not pass on ${MERGE_SHA} as pushed to main; refusing to publish." >&2
              exit 1
            fi
          fi
          prs="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${MERGE_SHA}/pulls")"
          release_pr="$(jq -c \
            --arg repository "$REPOSITORY" \
            '[ .[] |
              select(
                .merged_at != null and
                .base.ref == "main" and
                .base.repo.full_name == $repository and
                (.head.ref | startswith("release/")) and
                .head.repo.full_name == $repository
              )
            ] | first // empty' <<<"$prs")"
          if [[ -z "$release_pr" || "$release_pr" == "null" ]]; then
            echo "No merged release PR is associated with ${MERGE_SHA}; nothing to publish."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_base_sha="$(jq -r '.base.sha // empty' <<<"$release_pr")"
          release_head_sha="$(jq -r '.head.sha // empty' <<<"$release_pr")"
          if [[ ! "$release_base_sha" =~ ^[0-9a-fA-F]{40}$ || ! "$release_head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Merged release PR metadata did not contain valid base and head SHAs; refusing to publish." >&2
            exit 1
          fi

          release_checks="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${release_head_sha}/check-runs")"
          release_verification="$(jq -r \
            --arg head_sha "$release_head_sha" \
            'any(.check_runs[]?;
              .name == "release-verification" and
              .app.slug == "github-actions" and
              .head_sha == $head_sha and
              .conclusion == "success"
            )' <<<"$release_checks")"
          if [[ "$release_verification" != "true" ]]; then
            echo "Merged release PR ${release_head_sha} has no successful release-verification check; refusing to publish." >&2
            exit 1
          fi

          echo "Validated merged release PR for ${MERGE_SHA}."
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "release_base_sha=$release_base_sha" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: publish-release
    needs: prove-release
    if: needs.prove-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the validated merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prove-release.outputs.merge_sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # `changeset publish` runs the npm on PATH, so this decides which npm publishes.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.10.0
          registry-url: https://registry.npmjs.org

      - name: Check npm can publish through trusted publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          if ! printf '%s\n' 11.5.1 "$version" | sort -V -C; then
            echo "npm ${version} cannot publish through trusted publishing; it needs 11.5.1 or newer." >&2
            exit 1
          fi
          echo "npm ${version} can publish through trusted publishing."

      # Every step in this job can mint a token npm accepts, so no install script runs here; the root
      # postinstall's workspace links are made by name.
      - name: Install
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run scripts/link-for-node.ts

      - name: Validate the merged release artifact
        env:
          RELEASE_BASE_SHA: ${{ needs.prove-release.outputs.release_base_sha }}
          RELEASE_HEAD_SHA: ${{ needs.prove-release.outputs.merge_sha }}
        run: bun run release:check --merge

      - name: Publish versioned packages
        run: bun run changeset:publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # The smoke test installs from the registry and the deploy runs wrangler: third-party code, kept out
  # of the job that can publish.
  deploy-site:
    name: deploy-site
    needs: [prove-release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the validated merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prove-release.outputs.merge_sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # The site build reads the packages' dist and the corpora gen:llms writes.
      - name: Build the packages
        run: bun run build && bun run gen:llms

      - name: Smoke test published registry packages
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/core/package.json').version")"
          for attempt in 1 2 3; do
            if bun scripts/smoke.ts registry "$version"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 30
            fi
          done
          echo "Registry smoke failed for @nifrajs/*@${version} after 3 attempts" >&2
          exit 1

      - name: Deploy site to Cloudflare Pages
        working-directory: site
        run: |
          bun run build
          bunx wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe production site
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if body="$(curl --fail --silent --show-error https://nifra.dev/)"; then
              case "$body" in
                *"<title>Nifra - the TypeScript framework for AI-edited codebases</title>"*)
                  echo "Production health probe passed"
                  exit 0
                  ;;
              esac
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 20
            fi
          done
          echo "Production health probe failed: expected stable homepage marker" >&2
          exit 1

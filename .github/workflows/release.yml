name: Release

# Release preparation happens on a dedicated release/<name> branch. The release PR contains the
# changeset version commit and is the only PR that may introduce a release. This workflow never
# creates a second Version Packages PR and never writes to main from a pull_request run.
#
# After a release PR merges, the workflow_run path only publishes the exact CI-validated merge SHA.
# It is guarded by the GitHub API association between that SHA and a merged release PR, so an
# ordinary main merge is a no-op.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'publish' || github.event.pull_request.number }}
  queue: max
  cancel-in-progress: false

jobs:
  verify-release-pr:
    name: release-verification
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout the proposed release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release branch and generated versions
        run: bun run release:check

      - name: Run full release verification
        run: bun run verify:release

  publish:
    name: publish-release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Prove this is a merged release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          prs="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${MERGE_SHA}/pulls")"
          release_pr="$(jq -c \
            --arg repository "$REPOSITORY" \
            '[ .[] |
              select(
                .merged_at != null and
                .base.ref == "main" and
                .base.repo.full_name == $repository and
                (.head.ref | startswith("release/")) and
                .head.repo.full_name == $repository
              )
            ] | first // empty' <<<"$prs")"
          if [[ -z "$release_pr" || "$release_pr" == "null" ]]; then
            echo "No merged release PR is associated with ${MERGE_SHA}; nothing to publish."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_base_sha="$(jq -r '.base.sha // empty' <<<"$release_pr")"
          release_head_sha="$(jq -r '.head.sha // empty' <<<"$release_pr")"
          if [[ ! "$release_base_sha" =~ ^[0-9a-fA-F]{40}$ || ! "$release_head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Merged release PR metadata did not contain valid base and head SHAs; refusing to publish." >&2
            exit 1
          fi

          release_checks="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "repos/${REPOSITORY}/commits/${release_head_sha}/check-runs")"
          release_verification="$(jq -r \
            --arg head_sha "$release_head_sha" \
            'any(.check_runs[]?;
              .name == "release-verification" and
              .app.slug == "github-actions" and
              .head_sha == $head_sha and
              .conclusion == "success"
            )' <<<"$release_checks")"
          if [[ "$release_verification" != "true" ]]; then
            echo "Merged release PR ${release_head_sha} has no successful release-verification check; refusing to publish." >&2
            exit 1
          fi

          echo "Validated merged release PR for ${MERGE_SHA}."
          echo "is_release=true" >> "$GITHUB_OUTPUT"
          echo "release_base_sha=$release_base_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the validated merge
        if: steps.release.outputs.is_release == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Bun
        if: steps.release.outputs.is_release == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install
        if: steps.release.outputs.is_release == 'true'
        run: bun install --frozen-lockfile

      - name: Validate the merged release artifact
        if: steps.release.outputs.is_release == 'true'
        env:
          RELEASE_BASE_SHA: ${{ steps.release.outputs.release_base_sha }}
          RELEASE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bun run release:check --merge

      - name: Publish versioned packages
        if: steps.release.outputs.is_release == 'true'
        run: bun run changeset:publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Smoke test published registry packages
        if: steps.release.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/core/package.json').version")"
          for attempt in 1 2 3; do
            if bun scripts/smoke.ts registry "$version"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 30
            fi
          done
          echo "Registry smoke failed for @nifrajs/*@${version} after 3 attempts" >&2
          exit 1

      - name: Deploy site to Cloudflare Pages
        if: steps.release.outputs.is_release == 'true'
        working-directory: site
        run: |
          bun run build
          bunx wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe production site
        if: steps.release.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if body="$(curl --fail --silent --show-error https://nifra.dev/)"; then
              case "$body" in
                *"<title>Nifra - the TypeScript framework for AI-edited codebases</title>"*)
                  echo "Production health probe passed"
                  exit 0
                  ;;
              esac
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep 20
            fi
          done
          echo "Production health probe failed: expected stable homepage marker" >&2
          exit 1

name: Contention

# The library suite on a deliberately overloaded runner: two spinning threads per core run beside the
# tests. A test that holds only on an idle machine - a deadline a few ms out, a tight elapsed-time
# bound, a sleep standing in for a ready signal - fails here on a schedule instead of during a release.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  test-under-load:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # Cross-package tests load built declarations, as in the ci.yml check job.
      - name: Build
        run: bun run build

      - name: Test beside two spinning threads per core
        run: bun run test:contention

name: Partial prerendering

# Experimental partial prerendering's server, adapter and browser checks, on macOS as well as Linux.
# CI runs the server tests on Linux in every PR; this adds the browser engines and macOS when a change
# can reach the PPR path: the web packages, the runtimes and middleware it streams through, its fixtures.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ppr.yml"
      - "bun.lock"
      - "packages/core/src/**"
      - "packages/middleware/src/**"
      - "packages/node/src/**"
      - "packages/web/src/**"
      - "packages/web/test/ppr-*.test.ts"
      - "packages/web/test/fixtures/ppr/**"
      - "packages/web/test-node/ppr.test.ts"
      - "packages/web-react/src/**"
      - "packages/web-svelte/src/**"
      - "packages/web-svelte/test/ppr.test.ts"
      - "packages/web-svelte/test/fixtures/ppr-app/**"
  pull_request:
    paths:
      - ".github/workflows/ppr.yml"
      - "bun.lock"
      - "packages/core/src/**"
      - "packages/middleware/src/**"
      - "packages/node/src/**"
      - "packages/web/src/**"
      - "packages/web/test/ppr-*.test.ts"
      - "packages/web/test/fixtures/ppr/**"
      - "packages/web/test-node/ppr.test.ts"
      - "packages/web-react/src/**"
      - "packages/web-svelte/src/**"
      - "packages/web-svelte/test/ppr.test.ts"
      - "packages/web-svelte/test/fixtures/ppr-app/**"
  workflow_dispatch:

concurrency:
  group: ppr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ppr:
    name: ppr (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.12.0
      - run: bun install --frozen-lockfile
      # The Node test loads the built packages, as an installed Node app does.
      - run: bun run build
      - name: Server, cache, admission and adapter tests
        run: bun test test/ppr
        working-directory: packages/web
      - name: Svelte adapter tests
        run: bun test test/ppr
        working-directory: packages/web-svelte
      - name: Both Node lanes, with and without compression
        run: node --test packages/web/test-node/ppr.test.ts
      - name: Install required browser engines
        run: node packages/web/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nifra-playwright
      - name: React app in Chromium, Firefox and WebKit
        run: bun packages/web/test/fixtures/ppr/app-browser.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nifra-playwright
      - name: Svelte app in Chromium, Firefox and WebKit
        run: bun packages/web/test/fixtures/ppr/app-browser.ts
        env:
          FRAMEWORK: svelte
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/nifra-playwright

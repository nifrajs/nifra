name: Runtime differential

# The pull-request job in ci.yml replays one fixed seed. This explores: a fresh seed every night, a
# budget fifty times larger for requests and WebSocket sessions, and both NODE_ENV modes. A failure prints each distinct violation
# shrunk to a minimal request with a `--replay` command; the JSON report keeps every signature.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: Generated requests per mode
        type: number
        default: 20000
      ws_runs:
        description: Generated WebSocket sessions per mode
        type: number
        default: 3000
      seed:
        description: fast-check seed (empty for a fresh one)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  explore:
    name: explore (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        mode: [production, development]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.12.0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Generated requests on every runtime
        env:
          NIFRA_DIFFERENTIAL_RUNS: ${{ inputs.runs || 20000 }}
          NIFRA_DIFFERENTIAL_WS_RUNS: ${{ inputs.ws_runs || 3000 }}
          NIFRA_DIFFERENTIAL_SEED: ${{ inputs.seed }}
          NIFRA_DIFFERENTIAL_MODE: ${{ matrix.mode }}
          NIFRA_DIFFERENTIAL_REPORT: runtime-differential-${{ matrix.mode }}.json
        run: bun run check:runtime-differential

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-differential-${{ matrix.mode }}
          path: runtime-differential-${{ matrix.mode }}.json
          if-no-files-found: ignore

name: Temporary GET profiles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  profile:
    if: github.head_ref == 'codex/profile-get-waste'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.9.7
      - name: Install pinned load generator
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/oha" https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          echo "620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716  $HOME/.local/bin/oha" | sha256sum -c -
          chmod +x "$HOME/.local/bin/oha"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Record host and split physical cores
        run: |
          mkdir -p bench/temporary-get-results
          { git rev-parse HEAD; uname -a; lscpu; bun --version; node --version; deno --version; oha --version; } > bench/temporary-get-results/host.txt
          # shellcheck disable=SC2016
          bun -e 'import { readCoreSplit } from "./bench/ci/host.ts"; const s=readCoreSplit(); if (!s) throw Error("no core split"); console.log(`SERVER_CPUS=${s.server.join(",")}\nLOAD_CPUS=${s.load.join(",")}`)' >> "$GITHUB_ENV"
      - name: Measure lazy Deno peer address
        env:
          PROFILE_RUNTIME: ${{ matrix.runtime }}
        run: bun run bench/temporary-get-profile/deno-peer-ablation.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: temporary-get-profile-${{ matrix.runtime }}
          path: bench/temporary-get-results/
          if-no-files-found: error
          retention-days: 30

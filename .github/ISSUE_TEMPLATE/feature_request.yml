name: Feature request
description: Something Nifra should do that it does not do today.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas are welcome in [Discussions](https://github.com/nifrajs/nifra/discussions/categories/ideas) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where Nifra gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind, with a short code sample if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or how another framework handles it.
